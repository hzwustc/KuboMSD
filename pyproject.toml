[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "kubo-msd"
version = "1.1.0.dev4"
description = "Independent Gamma-point Kubo MSD transport with exact and stochastic solvers"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["quantum transport", "Kubo", "mean square displacement", "tight binding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "h5py>=3.8", "threadpoolctl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7"]
gpu = ["cupy-cuda12x>=13,<15"]
mpi = ["mpi4py>=3.1"]

[project.scripts]
kubomsd = "kubo_msd.cli:main"
kubomsd-prepare = "kubo_msd.operators.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: requires real CuPy/CUDA device", "real: requires identified material input", "mpi: requires real MPI subprocess communication"]
